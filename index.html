var mapObj = null;
var markerLayers = [];
var circleState = {};  // store.id -> { circles: [], visible: false }

document.addEventListener('DOMContentLoaded', function() {
    for (var key in window) {
        try {
            if (window[key] && typeof window[key].getCenter === 'function') {
                mapObj = window[key];
                break;
            }
        } catch(e) {}
    }
    if (mapObj) {
        renderStores();
    }
});

var GROUP_COLORS = {
    'JBJ_JYC': '#1A237E',
    'JBJ': '#2196F3',
    'JYC': '#9C27B0',
    'BRIDESMAIDS': '#FF9800',
    'LWD': '#4CAF50'
};

function getMarkerColor(group) {
    return GROUP_COLORS[group] || '#757575';
}

function buildTooltip(store) {
    var cats = store.cats;
    var parts = [];
    if (cats.indexOf('JBJ') >= 0) parts.push('<span style="color:#2196F3">&#9632; JBJ (60mi)</span>');
    if (cats.indexOf('JYC') >= 0) parts.push('<span style="color:#9C27B0">&#9632; JYC (90mi)</span>');
    if (cats.indexOf('BRIDESMAIDS') >= 0) parts.push('<span style="color:#FF9800">&#9632; Bridesmaids</span>');
    if (cats.indexOf('LWD') >= 0) parts.push('<span style="color:#4CAF50">&#9632; LWD</span>');
    var territory = parts.join(' &nbsp; ');

    return '<div style="font-family:Arial,sans-serif;min-width:180px">' +
        '<b style="font-size:13px">' + store.name + '</b><br>' +
        '<span style="color:#555;font-size:11px">' + store.address + '</span><br>' +
        '<div style="margin-top:4px;font-size:11px">' + territory + '</div></div>';
}

function toggleCircles(store) {
    var state = circleState[store.id];
    if (state.visible) {
        // Hide circles
        state.circles.forEach(function(c) { mapObj.removeLayer(c); });
        state.circles = [];
        state.visible = false;
    } else {
        // Show circles
        var cats = store.cats;
        if (cats.indexOf('JYC') >= 0) {
            var jycCircle = L.circle([store.lat, store.lon], {
                radius: 144840.6,
                color: '#9C27B0',
                weight: 1.2,
                dashArray: '6 4',
                fill: true,
                fillColor: '#9C27B0',
                fillOpacity: 0.06,
                opacity: 0.4,
                interactive: false
            }).addTo(mapObj);
            state.circles.push(jycCircle);
        }
        if (cats.indexOf('JBJ') >= 0) {
            var jbjCircle = L.circle([store.lat, store.lon], {
                radius: 96560.4,
                color: '#2196F3',
                weight: 1.2,
                fill: true,
                fillColor: '#2196F3',
                fillOpacity: 0.07,
                opacity: 0.4,
                interactive: false
            }).addTo(mapObj);
            state.circles.push(jbjCircle);
        }
        state.visible = true;
    }
}

function renderStores() {
    // Clear markers
    markerLayers.forEach(function(l) { mapObj.removeLayer(l); });
    markerLayers = [];

    // Clear any visible circles
    for (var id in circleState) {
        circleState[id].circles.forEach(function(c) { mapObj.removeLayer(c); });
    }
    circleState = {};

    var filters = {
        'JBJ_JYC': document.getElementById('cb-jbj-jyc').checked,
        'JBJ': document.getElementById('cb-jbj').checked,
        'JYC': document.getElementById('cb-jyc').checked,
        'BRIDESMAIDS': document.getElementById('cb-bm').checked,
        'LWD': document.getElementById('cb-lwd').checked
    };

    var visibleCount = 0;

    storeData.forEach(function(store) {
        if (!filters[store.group]) return;

        visibleCount++;
        var color = getMarkerColor(store.group);

        // Init circle state — show circles by default for JBJ/JYC
        circleState[store.id] = { circles: [], visible: false };
        var hasTerritory = store.cats.indexOf('JBJ') >= 0 || store.cats.indexOf('JYC') >= 0;
        if (hasTerritory) {
            toggleCircles(store);
        }

        var marker = L.circleMarker([store.lat, store.lon], {
            radius: 6,
            color: 'white',
            weight: 1.5,
            fillColor: color,
            fillOpacity: 0.9,
            fill: true
        }).addTo(mapObj);

        marker.bindTooltip(buildTooltip(store));

        // Click toggles territory circles (only for JBJ/JYC stores)
        var hasTeritory = store.cats.indexOf('JBJ') >= 0 || store.cats.indexOf('JYC') >= 0;
        if (hasTeritory) {
            marker.on('click', (function(s) {
                return function() { toggleCircles(s); };
            })(store));
            marker.setStyle({ cursor: 'pointer' });
        }

        markerLayers.push(marker);
    });

    document.getElementById('visible-count').textContent = visibleCount;
}

function applyFilters() {
    renderStores();
}

// ── Address cleaning ──
function cleanAddress(raw) {
    var q = raw;
    // Strip HTML tags (e.g. <br>)
    q = q.replace(/<[^>]+>/g, ', ');
    // Fix common encoding artifacts: _e -> e, | -> u
    q = q.replace(/_e/g, 'e').replace(/\|/g, 'u');
    // Remove control characters
    q = q.replace(/[␀-]/g, '');
    // Strip leading business name prefix: if there's a comma followed by a
    // street number, drop everything before that comma
    // e.g. "First Floor Retail- Nuevo Atrisco Apartment Complex, 201 Unser..."
    q = q.replace(/^[^,]+,\s*(?=\d+\s)/i, '');
    // Strip unit/suite/apt identifiers (only match unit-like words followed by a number/letter code)
    q = q.replace(/(Unit|Ste|Suite|Apt)\s*#?\s*[A-Za-z0-9-]+/gi, '');
    // Strip standalone # numbers (e.g. "#109")
    q = q.replace(/#\s*[0-9]+[A-Za-z]?/g, '');
    // Strip floor indicators like "2F", "1.OG", "2nd Floor", "First Floor"
    q = q.replace(/\d+(st|nd|rd|th)\s+floor/gi, '');
    q = q.replace(/(first|second|third|ground)\s+floor/gi, '');
    q = q.replace(/\d+\.\s*OG/gi, '');
    // Strip "Col." (Mexican colonia prefix)
    q = q.replace(/Col\.\s*/gi, '');
    // Clean up leftover punctuation and whitespace
    q = q.replace(/[,\s]{2,}/g, ', ').replace(/^[\s,]+|[\s,]+$/g, '');
    return q;
}

// Build progressively simpler fallback queries by removing parts from the front
function buildFallbacks(cleaned) {
    var parts = cleaned.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
    var queries = [cleaned];
    // Progressively drop leading parts to get neighborhood, then city level
    for (var i = 1; i < parts.length && parts.length - i >= 1; i++) {
        queries.push(parts.slice(i).join(', '));
    }
    return queries;
}

// ── Address search ──
var searchMarker = null;

function searchAddress() {
    var raw = document.getElementById('address-input').value.trim();
    if (!raw) return;

    var btn = document.getElementById('search-btn');
    btn.textContent = '...';
    btn.disabled = true;

    var cleaned = cleanAddress(raw);
    var queries = buildFallbacks(cleaned);

    function tryQuery(idx) {
        if (idx >= queries.length) {
            btn.textContent = 'Go';
            btn.disabled = false;
            alert('Address not found. Try simplifying the address (e.g. remove suite/unit numbers or business names).');
            return;
        }

        var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(queries[idx]);

        fetch(url)
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.length === 0) {
                    // Try next simpler query
                    tryQuery(idx + 1);
                    return;
                }

                btn.textContent = 'Go';
                btn.disabled = false;

                var lat = parseFloat(data[0].lat);
                var lon = parseFloat(data[0].lon);

                clearSearch();

                // Add a red marker for the searched location
                searchMarker = L.marker([lat, lon], {
                    icon: L.divIcon({
                        className: '',
                        html: '<div style="width:14px;height:14px;background:#E53935;border:2.5px solid white;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,0.4)"></div>',
                        iconSize: [14, 14],
                        iconAnchor: [7, 7]
                    })
                }).addTo(mapObj);

                var approxNote = idx > 0 ? '<br><span style="color:#E53935;font-size:10px">(approximate — city level)</span>' : '';
                searchMarker.bindTooltip(
                    '<div style="font-family:Arial,sans-serif">' +
                    '<b style="color:#E53935">Spot Check</b><br>' +
                    '<span style="color:#555;font-size:11px">' + data[0].display_name + '</span>' +
                    approxNote + '</div>'
                ).openTooltip();

                mapObj.setView([lat, lon], idx > 0 ? 10 : 8);
                document.getElementById('clear-btn').style.display = 'inline-block';
            })
            .catch(function() {
                btn.textContent = 'Go';
                btn.disabled = false;
                alert('Geocoding failed. Try again.');
            });
    }

    tryQuery(0);
}

function clearSearch() {
    if (searchMarker) {
        mapObj.removeLayer(searchMarker);
        searchMarker = null;
    }
    document.getElementById('clear-btn').style.display = 'none';
}

// Allow Enter key to search
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('address-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') searchAddress();
    });
});
</script>
