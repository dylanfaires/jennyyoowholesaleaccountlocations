    });

    document.getElementById('visible-count').textContent = visibleCount;
}

function applyFilters() { renderStores(); }

function renderUnmatched() {
    var html = '';
    unmatchedData.forEach(function(u) {
        var fill = u.fill;
        var cat = categorize(fill);
        var col = COLOR[cat] || { fill: '#eee' };
        html += '<div class="um-row" style="border-left:3px solid ' + (col.marker || '#999') + '">';
        html += '<div class="um-name">' + u.name + '</div>';
        if (u.note) html += '<div class="um-note">' + u.note + '</div>';
        html += '</div>';
    });
    document.getElementById('um-list').innerHTML = html;
}

function toggleUnmatched() {
    var p = document.getElementById('unmatched-panel');
    var btn = document.getElementById('toggle-um');
    if (p.style.display === 'none') {
        p.style.display = 'block';
        btn.textContent = 'Hide ' + unmatchedData.length + ' new/unmapped accounts';
    } else {
        p.style.display = 'none';
        btn.textContent = 'Show ' + unmatchedData.length + ' new/unmapped accounts';
    }
}

var REGIONS = {
    'world': { center: [20, 0],   zoom: 2 },
    'us':    { center: [39.5, -98.5], zoom: 4 },
    'eu':    { center: [50, 10],  zoom: 4 },
    'au':    { center: [-30, 145], zoom: 4 },
};

function zoomTo(region) {
    var r = REGIONS[region];
    mapObj.setView(r.center, r.zoom);
    document.querySelectorAll('#region-toggle button').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById('btn-' + region).classList.add('active');
}
